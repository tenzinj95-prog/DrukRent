<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - DrukRent</title>

    <link rel="stylesheet" href="css/admin-login.css">

</head>


<body>


<div class="login-container">


    <div class="login-box">


        <div class="admin-icon">
            🔐
        </div>


        <h1>
            DrukRent Admin
        </h1>


        <p>
            Login to manage properties
        </p>




        <form id="loginForm">


            <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>



            <input
            type="password"
            id="password"
            placeholder="Password"
            required>



            <button type="submit">
                Login
            </button>


        </form>



        <p id="message"></p>



    </div>


</div>





<!-- Admin Login Firebase Script -->

<script type="module" src="js/admin-login.js"></script>



</body>

</html>

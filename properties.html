<!-- PROPERTY SECTION -->


<section class="featured">



<h1>
Find Rental Homes in Bhutan 🇧🇹
</h1>



<p>
Browse houses, apartments and rooms available for rent.
</p>






<!-- SEARCH -->

<div class="search-box">


<input

type="text"

id="searchProperty"

placeholder="Search location or house name">


</div>







<!-- FILTERS -->


<div class="filters">





<!-- DZONGKHAG -->

<select id="dzongkhagFilter">


<option value="">
All Dzongkhag
</option>


</select>






<!-- GEWOG -->

<select id="gewogFilter">


<option value="">
All Gewog
</option>


</select>







<!-- BEDROOM -->

<select id="bedroomFilter">


<option value="">
Any Bedroom
</option>


<option value="1">
1 Bedroom
</option>


<option value="2">
2 Bedrooms
</option>


<option value="3">
3 Bedrooms
</option>


<option value="4">
4 Bedrooms
</option>


<option value="5">
5+ Bedrooms
</option>


</select>








<!-- PRICE -->


<select id="priceFilter">


<option value="">
Any Rent
</option>


<option value="10000">
Below Nu. 10,000
</option>


<option value="20000">
Below Nu. 20,000
</option>


<option value="30000">
Below Nu. 30,000
</option>


<option value="50000">
Below Nu. 50,000
</option>


</select>



</div>









<!-- PROPERTY CARDS -->

<div

class="property-container"

id="propertyContainer">


</div>
